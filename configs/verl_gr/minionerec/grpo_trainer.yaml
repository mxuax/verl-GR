# MiniOneRec GRPO config for verl-GR.

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

task:
  name: minionerec
  class_path: verl_gr.recipes.minionerec.minionerec_recipe.MiniOneRecTask
  trainer_adapter_class: verl_gr.recipes.minionerec.minionerec_trainer.MiniOneRecTrainerAdapter

data:
  max_prompt_length: 2560
  prompt_key: prompt
  shuffle: false
  max_response_length: 64
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 16
  truncation: error
  custom_cls:
    name: MiniOneRecDataset
    path: null
  category: Industrial_and_Scientific
  include_alignment_tasks: true
  include_alignment_tasks_for_val: false
  sid_index_path: null
  item_meta_path: null
  seq_title_sample: 10000
  data_source_key: source
  reward_fn_key: source

custom_reward_function:
  name: compute_score
  path: null

actor_rollout_ref:
  hybrid_engine: true

  ref:
    entropy_from_logits_with_chunking: true
    fsdp_config:
      model_dtype: bfloat16
    profiler:
      enable: ${oc.select:actor_rollout_ref.actor.profiler.enable,false}
      all_ranks: ${oc.select:actor_rollout_ref.actor.profiler.all_ranks,false}
      ranks: ${oc.select:actor_rollout_ref.actor.profiler.ranks,[]}

  actor:
    # 与 ref 一致：rmpad 路径下用分块熵，避免 (bsz, seq, vocab) 全量 softmax 导致数十 GB 峰值
    entropy_from_logits_with_chunking: true
    entropy_checkpointing: true
    clip_ratio_high: 0.28
    use_dynamic_bsz: true
    ppo_mini_batch_size: 8
    ppo_max_token_len_per_gpu: 40960
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    optim:
      lr: 2e-6
      lr_warmup_steps: 10
      weight_decay: 0.1
    fsdp_config:
      model_dtype: bfloat16
    profiler:
      enable: false
      all_ranks: false
      ranks: [0]

  rollout:
    name: constrained_beam
    n: 1
    dtype: bfloat16
    tensor_model_parallel_size: 1
    temperature: 1.0
    top_p: 1.0
    do_sample: true
    gpu_memory_utilization: 0.8
    max_num_batched_tokens: 40960
    max_num_seqs: 2048
    log_prob_max_token_len_per_gpu: 40960
    enable_chunked_prefill: true
    calculate_log_probs: false
    layered_summon: false
    custom:
      # MiniOneRec semantics: constrained-beam groups per prompt before beam expansion.
      # Effective rollout requests per prompt = num_generations_per_prompt * beam_width.
      num_generations_per_prompt: 1
      beam_width: 20
      decode_mode_train: stochastic_constrained
      decode_mode_val: deterministic_beam
      disable_cache_in_train: true
      constrained_beam_max_inflight_requests: 64
      beam_search_params:
        max_tokens: 16
        logprobs_multiplier: 2
        constraint:
          type: minionerec_prefix_trie
          info_file: null
          base_model: null
          fallback_to_eos: true
    agent:
      num_workers: 8
      agent_loop_manager_class: verl_gr.recipes.minionerec.constrained_beam_agent_loop.MiniOneRecConstrainedBeamAgentLoopManager
      default_agent_loop: minionerec_constrained_beam_agent
    engine_kwargs:
      vllm:
        max_logprobs: 320
    profiler:
      enable: ${oc.select:actor_rollout_ref.actor.profiler.enable,false}
      all_ranks: ${oc.select:actor_rollout_ref.actor.profiler.all_ranks,false}
      ranks: ${oc.select:actor_rollout_ref.actor.profiler.ranks,[]}

  model:
    enable_activation_offload: true
    enable_gradient_checkpointing: true
    # 必须为 true，否则 FSDP 在 use_fused_kernels=false 时走非 rmpad 分支，
    # entropy_from_logits 会对整段 padded logits 做 softmax，大词表下易 OOM。
    use_remove_padding: true
    use_fused_kernels: false
    fused_kernel_options:
      impl_backend: torch

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

trainer:
  project_name: MiniOneRec_RL
  experiment_name: minionerec_grpo_constrained_beam
  val_before_train: true
  best_ckpt_metric: val-aux/*/hr@20/mean
  default_hdfs_dir: null
  logger: [tensorboard]
  remove_previous_ckpt_in_save: true
  save_freq: 20
  test_freq: 20
  total_epochs: 2
  nnodes: 1
  n_gpus_per_node: 8

critic:
  enable: false
  profiler:
    enable: ${oc.select:actor_rollout_ref.actor.profiler.enable,false}
    all_ranks: ${oc.select:actor_rollout_ref.actor.profiler.all_ranks,false}
    ranks: ${oc.select:actor_rollout_ref.actor.profiler.ranks,[]}

global_profiler:
  tool: null
  steps: null
  profile_continuous_steps: false
  save_path: outputs/profile/minionerec

ray_init:
  num_cpus: null
  timeline_json_file: null
