# @package _
# MiniOneRec GRPO config for verl-GR — DDP variant (no FSDP).
# Uses PyTorch DistributedDataParallel instead of FSDP for faster
# training on small models.
#
# Defaults are inlined from ppo_trainer.yaml instead of using
# - /ppo_trainer because Hydra cannot resolve ${model_engine}*
# interpolations when ppo_trainer is included as a defaults entry
# from a subdirectory config (even with # @package _).

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  # === Inlined from ppo_trainer.yaml ===
  - model_engine: dp
  - actor@actor_rollout_ref.actor: dp_actor
  - data@data: legacy_data
  - ref@actor_rollout_ref.ref: dp_ref
  - rollout@actor_rollout_ref.rollout: rollout
  - model@actor_rollout_ref.model: hf_model
  - critic@critic: dp_critic
  - model@critic.model: hf_model
  - /legacy_reward_impl
  - reward@reward: reward
  - /algorithm@algorithm.rollout_correction: rollout_correction
  - /distillation@distillation: distillation
  # === End ppo_trainer defaults ===
  - _self_

task:
  name: minionerec
  class_path: verl_gr.recipes.minionerec.minionerec_recipe.MiniOneRecTask
  trainer_adapter_class: verl_gr.recipes.minionerec.minionerec_trainer.MiniOneRecTrainerAdapter

data:
  max_prompt_length: 2560
  prompt_key: prompt
  shuffle: false
  max_response_length: 256
  filter_overlong_prompts: false
  truncation: left
  custom_cls:
    name: MiniOneRecDataset
    path: null
  category: Industrial_and_Scientific
  include_alignment_tasks: true
  include_alignment_tasks_for_val: false
  sid_index_path: null
  item_meta_path: null
  seq_title_sample: 10000
  data_source_key: source
  reward_fn_key: source

custom_reward_function:
  name: compute_score
  path: null

reward:
  num_workers: 1

actor_rollout_ref:
  hybrid_engine: true

  ref:
    _target_: verl_gr.workers.config.ddp_engine.DDPActorConfig
    strategy: ddp
    entropy_from_logits_with_chunking: true
    entropy_checkpointing: false
    engine_config:
      _target_: verl_gr.workers.config.ddp_engine.DDPEngineConfig
      strategy: ddp
      forward_only: true
      model_dtype: bf16
      use_torch_compile: true
      seed: 42

  actor:
    _target_: verl_gr.workers.config.ddp_engine.DDPActorConfig
    strategy: ddp
    entropy_from_logits_with_chunking: true
    entropy_checkpointing: true
    use_dynamic_bsz: true
    ppo_mini_batch_size: 8
    ppo_max_token_len_per_gpu: 40960
    loss_agg_mode: seq-mean-token-mean
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    policy_loss:
      loss_mode: minionerec_reinforce
    engine_config:
      _target_: verl_gr.workers.config.ddp_engine.DDPEngineConfig
      strategy: ddp
      model_dtype: bf16
      use_torch_compile: true
      seed: 42
    optim:
      lr: 1e-5
      lr_warmup_steps_ratio: 0.03
      weight_decay: 0.0
      clip_grad: 0.3
      lr_scheduler_type: cosine

  rollout:
    name: constrained_beam
    n: 1
    dtype: bfloat16
    tensor_model_parallel_size: 1
    temperature: 1.0
    top_p: 1.0
    do_sample: true
    gpu_memory_utilization: 0.8
    max_num_batched_tokens: 40960
    max_num_seqs: 2048
    log_prob_max_token_len_per_gpu: 40960
    enable_chunked_prefill: true
    calculate_log_probs: false
    layered_summon: false
    custom:
      num_generations_per_prompt: 1
      beam_width: 16
      val_beam_width: 50
      decode_mode_train: hf_constrained_beam_sample
      decode_mode_val: hf_constrained_beam_eval
      disable_cache_in_train: true
      constrained_beam_max_inflight_requests: 64
      beam_search_params:
        max_tokens: 16
        logprobs_multiplier: 2
        constraint:
          type: minionerec_prefix_trie
          info_file: null
          base_model: null
          fallback_to_eos: true
    agent:
      num_workers: 8
      agent_loop_manager_class: verl_gr.recipes.minionerec.constrained_beam_agent_loop.MiniOneRecConstrainedBeamAgentLoopManager
      default_agent_loop: minionerec_constrained_beam_agent
    engine_kwargs:
      vllm:
        max_logprobs: 320

  model:
    enable_activation_offload: true
    enable_gradient_checkpointing: true
    use_remove_padding: true
    use_fused_kernels: false
    fused_kernel_options:
      impl_backend: torch

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

trainer:
  project_name: MiniOneRec_RL
  experiment_name: minionerec_grpo_ddp
  val_before_train: true
  best_ckpt_metric: val-aux/*/hr@20/mean
  default_hdfs_dir: null
  logger: [tensorboard]
  remove_previous_ckpt_in_save: true
  save_freq: 165
  test_freq: 165
  total_epochs: 2
  nnodes: 1
  n_gpus_per_node: 8

critic:
  enable: false

global_profiler:
  tool: null
  steps: null
  profile_continuous_steps: false
  save_path: outputs/profile/minionerec

ray_init:
  num_cpus: null
  timeline_json_file: null
