defaults:
  - ddp_ref
  - _self_

# TRL SyncRefModelCallback defaults: EMA mixup every 512 steps.
# alpha=0.6 → ref = 0.6 * ref + 0.4 * actor (soft tracking).
# Set to 0 for hard copy, 1 for frozen ref.
sync_freq: 512
ref_model_mixup_alpha: 0.6

entropy_from_logits_with_chunking: true
entropy_checkpointing: false

engine_config:
  forward_only: true
  model_dtype: bf16
  use_torch_compile: false
  disable_flash_sdp: true
  seed: 42
  completion_only_logprob: true
  # Match actor default: use the rmpad completion-only fast path unless the
  # launcher explicitly requests the padded parity path.
  completion_only_force_padded: false
  completion_only_drop_position_ids: true
